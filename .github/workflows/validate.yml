name: Validate WordWaifu

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # v7.0.1; pinned to the verified upstream commit SHA (Node 24 runtime).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        # v7.1.0; pinned to the verified upstream commit SHA (Node 24 runtime).
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/mythic-catalog.js
          node --check src/power-catalog.js
          node --check src/power-workbench.js
          node --check src/project-schema.js
          node --check src/project-repository.js
          node --check src/story-outline.js
          node --check src/story-forge.js
          node --check src/fanfic-review.js
          node --check tests/test_fanfic_review.cjs
          node --check tests/benchmark_story_forge.cjs
          node --check tests/test_story_forge.cjs
          node --check src/art-studio.js
          node --check src/character-dossiers.js
          node --check tests/test_character_dossiers.cjs
          node --check tests/test_official_character_roster.cjs
          node --check tests/test_danmachi_character_coverage.cjs
          node --check scripts/sync-danmachi-status.mjs
          node --check tests/test_danmachi_family_dossier.cjs
          node --check tests/test_project_schema.cjs
          node --check tests/test_mythic_catalog.cjs
          node --check tests/test_power_catalog.cjs
          node --check tests/test_story_outline.cjs
          node --check tests/browser_smoke.cjs
      - name: Validate mythic catalog IDs and relations
        run: node tests/test_mythic_catalog.cjs
      - name: Test power catalog generator
        run: node tests/test_power_catalog.cjs
      - name: Test story outline generation
        run: node tests/test_story_outline.cjs
      - name: Test Story Forge outline and audit
        run: node tests/test_story_forge.cjs
      - name: Test local fanfiction consistency review
        run: node tests/test_fanfic_review.cjs
      - name: Measure Story Forge generation cost (informational)
        run: node tests/benchmark_story_forge.cjs
      - name: Test project import validation
        run: node tests/test_project_schema.cjs
      - name: Test extended character dossiers
        run: node tests/test_character_dossiers.cjs
      - name: Test DanMachi roster coverage and navigation integrity
        run: node tests/test_danmachi_character_coverage.cjs
      - name: Validate official adaptation roster
        run: node tests/test_official_character_roster.cjs
      - name: Verify generated DanMachi metrics and roster contract
        run: node scripts/sync-danmachi-status.mjs --check
      - name: Validate DanMachi lore catalog links and IDs
        run: node lore/danmachi/tools/check-catalog.mjs
      - name: Test DanMachi Hestia Familia dossier evidence
        run: node tests/test_danmachi_family_dossier.cjs
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: node tests/browser_smoke.cjs
      - name: Check project structure
        run: python scripts/validate_project.py