name: Validate WordWaifu

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/project-schema.js
          node --check src/project-repository.js
          node --check src/art-studio.js
          node --check src/character-dossiers.js
          node --check src/power-catalog.js
          node --check src/universe-graph.js
          node --check src/universe-explorer.js
          node --check src/power-workbench.js
          node --check src/code-geass-lore.js
          node --check tests/test_power_catalog.cjs
          node --check tests/test_universe_graph.cjs
          node --check tests/test_code_geass_lore.cjs
          node --check tests/test_character_dossiers.cjs
          node --check tests/test_project_schema.cjs
          node --check tests/browser_smoke.cjs
      - name: Test project import validation
        run: node tests/test_project_schema.cjs
      - name: Test original power generator
        run: node tests/test_power_catalog.cjs
      - name: Test connected lore graph
        run: node tests/test_universe_graph.cjs
      - name: Test Code Geass canon corpus
        run: node tests/test_code_geass_lore.cjs
      - name: Test extended character dossiers
        run: node tests/test_character_dossiers.cjs
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: node tests/browser_smoke.cjs
      - name: Check project structure
        run: python scripts/validate_project.py
