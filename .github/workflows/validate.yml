name: Validate WordWaifu

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/mythic-catalog.js
          node --check src/power-catalog.js
          node --check src/power-workbench.js
          node --check src/project-schema.js
          node --check src/project-repository.js
          node --check src/story-foundry.js
          node --check src/fanfic-review.js
          node --check tests/test_fanfic_review.cjs
          node --check tests/test_story_foundry.cjs
          node --check tests/test_story_universe_catalog.cjs
          node --check src/art-studio.js
          node --check src/character-dossiers.js
          node --check tests/test_character_dossiers.cjs
          node --check tests/test_danmachi_timeline.cjs
          node --check lore/danmachi/tools/check-timeline.mjs
          node --check tests/test_official_character_roster.cjs
          node --check tests/test_danmachi_family_dossier.cjs
          node --check tests/test_project_schema.cjs
          node --check tests/test_mythic_catalog.cjs
          node --check tests/test_power_catalog.cjs
          node --check tests/browser_smoke.cjs
      - name: Test Story Foundry chapter and arc generator
        run: node tests/test_story_foundry.cjs
      - name: Test offline fanfiction review and author exceptions
        run: node tests/test_fanfic_review.cjs
      - name: Test story universe catalog and inspiration presets
        run: node tests/test_story_universe_catalog.cjs
      - name: Validate mythic catalog IDs and relations
        run: node tests/test_mythic_catalog.cjs
      - name: Test power catalog generator
        run: node tests/test_power_catalog.cjs
      - name: Test project import validation
        run: node tests/test_project_schema.cjs
      - name: Test extended character dossiers
        run: node tests/test_character_dossiers.cjs
      - name: Validate official adaptation roster
        run: node tests/test_official_character_roster.cjs
      - name: Validate DanMachi lore catalog links and IDs
        run: node lore/danmachi/tools/check-catalog.mjs
      - name: Validate DanMachi era tree and historical-event timeline
        run: node lore/danmachi/tools/check-timeline.mjs
      - name: Test DanMachi timeline hierarchy and continuity separation
        run: node tests/test_danmachi_timeline.cjs
      - name: Test DanMachi Hestia Familia dossier evidence
        run: node tests/test_danmachi_family_dossier.cjs
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: node tests/browser_smoke.cjs
      - name: Check project structure
        run: python scripts/validate_project.py
