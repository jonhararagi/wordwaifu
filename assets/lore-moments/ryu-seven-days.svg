<title id="title">Los siete días de la muerte · recreación conceptual</title>
<desc id="desc">Una aventurera rubia de espaldas bajo la lluvia contempla una espada caída y hojas arrastradas por el viento. Ilustración simbólica original no oficial sobre pérdida y cambio.</desc>
